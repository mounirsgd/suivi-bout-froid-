<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Suivi Bout Froid — SGD Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu:     #143FF2;   /* barres */
    --saumon:   #d9614a;   /* ecart defavorable */
    --cmt:      #33404f;   /* texte des commentaires */
    --vert:     #158f4a;   /* objectif, ecart favorable */
    --navy:     #14264a;   /* bandeau */
    --titre:    #0d1520;   /* titres de panneau */
    --texte:    #1c2733;
    --muted:    #5c6a7a;
    --bg:       #eceff4;
    --surface:  #ffffff;
    --rule:     #d7dde5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--texte);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 24px;
    display: flex; flex-wrap: wrap;
    align-items: baseline; gap: 6px 18px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  header .site { color: #a9bde4; font-size: 14px; }
  header .maj  { color: #a9bde4; font-size: 13px; margin-left: auto; }

  main { padding: 20px 24px 48px; max-width: 1360px; margin: 0 auto; }

  /* ── Filtres ──────────────────────────────────────────────────────────── */
  .filtres {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;
  }
  .groupe { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .groupe > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  button.chip {
    font: inherit; font-size: 13px;
    padding: 6px 13px;
    border: 1px solid var(--rule); border-radius: 999px;
    background: #f6f8fa; color: var(--texte); cursor: pointer;
  }
  button.chip:hover { border-color: var(--bleu); }
  button.chip[aria-pressed="true"] {
    background: var(--bleu); border-color: var(--bleu); color: #fff;
  }
  button.chip:focus-visible { outline: 3px solid #93aaf8; outline-offset: 2px; }
  .periodes { max-height: 104px; overflow-y: auto; padding-right: 4px; }

  /* ── Panneaux ─────────────────────────────────────────────────────────── */
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 18px; }
  .panneau {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 10px; padding: 16px 18px 18px; min-width: 0;
  }
  .panneau h2 { margin: 0 0 2px; font-size: 16.5px; font-weight: 700; color: var(--titre); }
  .panneau .sous { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }

  .toile { position: relative; height: 320px; }
  .vide {
    height: 200px; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); font-size: 14px;
    background: #f8fafb; border: 1px dashed var(--rule); border-radius: 8px; padding: 0 20px;
  }

  .legende { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .legende i { display: inline-block; vertical-align: middle; margin-right: 7px; }
  .legende .b { background: var(--bleu); width: 11px; height: 11px; border-radius: 2px; }
  .legende .t { background: var(--vert); width: 22px; height: 3px; border-radius: 2px; }

  /* ── Tableau de detail ────────────────────────────────────────────────── */
  .detail { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .detail h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; color: var(--titre); }
  .detail .aide { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .cadre { max-height: 260px; overflow: auto; border: 1px solid var(--rule); border-radius: 7px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: #f4f6f9; color: var(--muted);
    font-weight: 600; text-align: left;
    padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  tbody td { padding: 7px 10px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.ligne { font-weight: 600; color: var(--titre); }
  td.cmt { color: var(--cmt); min-width: 200px; }
  .cmt-bloc + .cmt-bloc { margin-top: 7px; }
  .cmt-tache {
    display: block; font-weight: 600; color: var(--titre);
    font-size: 12px; margin-bottom: 1px;
  }
  .cmt-texte { display: block; }
  td.dates { color: var(--muted); font-size: 12px; min-width: 140px; }
  .hors-pareto {
    margin: 10px 0 0; font-size: 12.5px; color: var(--muted);
    background: #f6f8fa; border: 1px solid var(--rule);
    border-radius: 7px; padding: 8px 11px;
  }
  .plus-lent { color: var(--saumon); font-weight: 600; }
  .plus-vite { color: var(--vert); font-weight: 600; }

  /* ── Evolution mois par mois ──────────────────────────────────────────── */
  .evolution .bloc + .bloc { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .evolution .nom {
    font-size: 13.5px; font-weight: 600; color: var(--titre); margin-bottom: 10px;
  }
  .mois-ligne {
    display: grid; grid-template-columns: 42px 1fr auto;
    align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .mois-nom { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .piste-mois { position: relative; height: 26px; background: #f1f3f7; border-radius: 5px; }
  .barre-mois {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--bleu); border-radius: 5px; opacity: .88;
  }
  .points { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  .point {
    position: absolute; top: 50%; width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px; border-radius: 50%;
    background: #fff; border: 1.5px solid var(--navy); box-shadow: 0 0 0 1px #fff;
  }
  .valeur-mois {
    font-size: 13px; font-weight: 600; color: var(--titre);
    white-space: nowrap; text-align: right; min-width: 108px;
  }
  .valeur-mois em {
    font-style: normal; font-weight: 600; font-size: 12px; margin-left: 7px;
  }
  .en-baisse { color: var(--vert); }
  .en-hausse { color: var(--saumon); }
  .stable    { color: var(--muted); }
  .repere-obj {
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--vert);
  }
  .note-evo { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

  /* ── Tableau des causes ───────────────────────────────────────────────── */
  .causes { margin-top: 18px; }
  .causes .cadre { max-height: 420px; }
  .tab-causes tbody td { padding: 9px 12px; }
  .tab-causes tbody tr:nth-child(-n+3) .rang { background: var(--bleu); color: #fff; }

  td.cause { color: var(--texte); }
  .rang {
    display: inline-block; min-width: 20px; height: 20px; line-height: 20px;
    text-align: center; border-radius: 5px; margin-right: 9px;
    background: #eef1f6; color: var(--muted);
    font-size: 11.5px; font-weight: 600; vertical-align: 1px;
  }
  .marque {
    display: inline-block; margin-left: 8px; padding: 1px 7px;
    border: 1px solid var(--rule); border-radius: 999px;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  td.fois { font-weight: 600; color: var(--titre); width: 58px; }
  td.pct { width: 140px; white-space: nowrap; }
  .pct-val { display: block; text-align: right; font-weight: 600; color: var(--titre); }
  .piste {
    display: block; height: 5px; border-radius: 3px;
    background: #e6eaf1; margin-top: 4px; overflow: hidden;
  }
  .jauge { display: block; height: 100%; border-radius: 3px; background: var(--bleu); }

  .etat {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 10px; padding: 28px; text-align: center; color: var(--muted);
  }

  @media (max-width: 560px) {
    header, main { padding-left: 14px; padding-right: 14px; }
    header .maj { margin-left: 0; width: 100%; }
    .grille { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Suivi Bout Froid</h1>
  <span class="site">SGD Pharma — Sucy-en-Brie</span>
  <span class="maj" id="maj"></span>
</header>

<main>
  <div class="filtres" id="filtres" hidden>
    <div class="groupe">
      <span>Periode</span>
      <div class="chips" id="mode"></div>
    </div>
    <div class="groupe" style="flex:1">
      <span id="label-periode">Mois</span>
      <div class="chips periodes" id="periodes"></div>
    </div>
    <div class="groupe">
      <span>Unite</span>
      <div class="chips" id="unite"></div>
    </div>
  </div>

  <div class="etat" id="etat">Chargement des donnees…</div>
  <div class="grille" id="grille" hidden></div>
  <div id="pareto" hidden></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var MOIS = ["janvier","fevrier","mars","avril","mai","juin",
              "juillet","aout","septembre","octobre","novembre","decembre"];

  var BLEU = "#143FF2", VERT = "#158f4a", SAUMON = "#d9614a";

  var donnees = null;
  var mode = "mois";
  var periode = null;
  var unite = "min";
  var graphes = {};

  // ── Dates ─────────────────────────────────────────────────────────────────

  function versDate(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function cleMois(iso) { return iso.slice(0, 7); }
  function libelleMois(cle) { var p = cle.split("-"); return MOIS[+p[1]-1] + " " + p[0]; }

  function lundi(d) {
    var j = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    j.setDate(j.getDate() - ((j.getDay() + 6) % 7));
    return j;
  }
  function isoDate(d) {
    return d.getFullYear() + "-" +
           String(d.getMonth()+1).padStart(2,"0") + "-" +
           String(d.getDate()).padStart(2,"0");
  }
  function cleSemaine(iso) { return isoDate(lundi(versDate(iso))); }
  function libelleSemaine(cle) {
    var d = versDate(cle);
    var f = new Date(d.getFullYear(), d.getMonth(), d.getDate()+6);
    var c = function (x) { return x.getDate() + " " + MOIS[x.getMonth()].slice(0,4); };
    return c(d) + " – " + c(f);
  }
  function cleDe(iso) { return mode === "mois" ? cleMois(iso) : cleSemaine(iso); }
  function libelleDe(cle) { return mode === "mois" ? libelleMois(cle) : libelleSemaine(cle); }

  function jourCourt(iso) {
    var d = versDate(iso);
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
  }

  // ── Durees ────────────────────────────────────────────────────────────────

  function formater(minutes) {
    if (minutes === null || minutes === undefined) return "";
    var t = Math.round(minutes);
    if (unite === "min") return t + " min";
    var h = Math.floor(Math.abs(t)/60), m = Math.abs(t)%60;
    var s = (t < 0 ? "-" : "") + (h === 0 ? m + "m" : h + "h " + String(m).padStart(2,"0") + "m");
    return s;
  }
  function convertir(minutes) {
    return unite === "min" ? Math.round(minutes) : Math.round(minutes/6)/10;
  }

  // ── Filtres ───────────────────────────────────────────────────────────────

  function periodesDisponibles() {
    var v = {};
    donnees.mesures.forEach(function (m) { v[cleDe(m.date)] = true; });
    return Object.keys(v).sort();
  }
  function periodeParDefaut(liste) {
    var c = cleDe(isoDate(new Date()));
    if (liste.indexOf(c) > -1) return c;
    return liste.length ? liste[liste.length-1] : null;
  }
  function faireChips(hote, options, actif, auClic) {
    hote.innerHTML = "";
    options.forEach(function (o) {
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = o.libelle;
      b.setAttribute("aria-pressed", o.valeur === actif ? "true" : "false");
      b.addEventListener("click", function () { auClic(o.valeur); });
      hote.appendChild(b);
    });
  }
  function dessinerFiltres() {
    faireChips(document.getElementById("mode"),
      [{valeur:"mois",libelle:"Mois"},{valeur:"semaine",libelle:"Semaine"}], mode,
      function (v) {
        if (v === mode) return;
        mode = v;
        document.getElementById("label-periode").textContent = mode === "mois" ? "Mois" : "Semaine";
        periode = periodeParDefaut(periodesDisponibles());
        dessinerFiltres(); dessinerTout();
      });

    faireChips(document.getElementById("periodes"),
      periodesDisponibles().map(function (c) { return {valeur:c, libelle:libelleDe(c)}; }),
      periode, function (v) { periode = v; dessinerFiltres(); dessinerTout(); });

    faireChips(document.getElementById("unite"),
      [{valeur:"min",libelle:"Minutes"},{valeur:"h",libelle:"Heures"}], unite,
      function (v) { unite = v; dessinerFiltres(); dessinerTout(); });

    document.getElementById("filtres").hidden = false;
  }

  // ── Agregation ────────────────────────────────────────────────────────────

  function mesuresPeriode(metrique) {
    return donnees.mesures.filter(function (m) {
      return m.metrique === metrique && cleDe(m.date) === periode;
    });
  }

  function parLigne(metrique) {
    var cumuls = {};
    mesuresPeriode(metrique).forEach(function (m) {
      if (!cumuls[m.ligne]) cumuls[m.ligne] = { somme:0, nb:0 };
      cumuls[m.ligne].somme += m.duree_min;
      cumuls[m.ligne].nb += 1;
    });
    return Object.keys(cumuls).map(function (l) {
      return { ligne:l, valeur:cumuls[l].somme/cumuls[l].nb, nb:cumuls[l].nb };
    }).sort(function (a,b) { return a.valeur - b.valeur; });
  }

  // ── Etiquettes dessinees sur le graphe ────────────────────────────────────

  var etiquettes = {
    id: "etiquettes",
    afterDatasetsDraw: function (chart, args, opts) {
      if (!opts || !opts.lignes) return;      // ne concerne pas le Pareto
      var ctx = chart.ctx;
      var lignes = opts.lignes, targets = opts.targets;

      ctx.save();
      ctx.textAlign = "center";

      // valeurs au-dessus des barres
      var barres = chart.getDatasetMeta(0);
      ctx.font = "600 12.5px 'IBM Plex Sans', Arial, sans-serif";
      ctx.fillStyle = "#0d1520";
      barres.data.forEach(function (el, i) {
        ctx.textBaseline = "bottom";
        ctx.fillText(opts.formater(lignes[i].valeur), el.x, el.y - 6);
      });

      // valeurs sur la ligne d'objectif, dans une pastille
      if (chart.data.datasets.length < 2) { ctx.restore(); return; }
      var pts = chart.getDatasetMeta(1);
      ctx.font = "600 11.5px 'IBM Plex Sans', Arial, sans-serif";
      pts.data.forEach(function (el, i) {
        var brut = targets[lignes[i].ligne];
        if (brut === null || brut === undefined) return;
        var texte = opts.formater(brut);
        var l = ctx.measureText(texte).width + 12;
        var h = 18;
        // sous le point si la barre est au-dessus, au-dessus sinon
        var hautBarre = barres.data[i].y;
        var y = (el.y > hautBarre + 22) ? el.y + 8 : el.y - h - 8;
        var x = el.x - l/2;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = VERT;
        ctx.lineWidth = 1;
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, l, h, 4); ctx.fill(); ctx.stroke(); }
        else { ctx.fillRect(x, y, l, h); ctx.strokeRect(x, y, l, h); }
        ctx.fillStyle = VERT;
        ctx.textBaseline = "middle";
        ctx.fillText(texte, el.x, y + h/2 + .5);
      });
      ctx.restore();
    }
  };
  Chart.register(etiquettes);


  // ── Tableau de detail ─────────────────────────────────────────────────────

  function construireTableau(metrique, targets) {
    var lignes = mesuresPeriode(metrique).slice();

    lignes.forEach(function (m) {
      var t = targets[m.ligne];
      m._ecart = (t === null || t === undefined) ? null : m.duree_min - t;
    });

    // le plus lent d'abord
    lignes.sort(function (a, b) {
      if (a._ecart === null) return 1;
      if (b._ecart === null) return -1;
      return b._ecart - a._ecart;
    });

    var bloc = document.createElement("div");
    bloc.className = "detail";

    var h3 = document.createElement("h3");
    h3.textContent = "Detail des saisies";
    bloc.appendChild(h3);

    var aide = document.createElement("p");
    aide.className = "aide";
    aide.textContent = lignes.length + " saisie" + (lignes.length > 1 ? "s" : "") +
                       " sur la periode, de la plus lente a la plus rapide.";
    bloc.appendChild(aide);

    var cadre = document.createElement("div");
    cadre.className = "cadre";
    var table = document.createElement("table");
    table.innerHTML =
      "<thead><tr><th>Date</th><th>Ligne</th><th>Duree</th>" +
      "<th>Ecart objectif</th><th>Commentaire</th></tr></thead>";

    var corps = document.createElement("tbody");
    lignes.forEach(function (m) {
      var tr = document.createElement("tr");

      var td1 = document.createElement("td");
      td1.className = "num"; td1.textContent = jourCourt(m.date); tr.appendChild(td1);

      var td2 = document.createElement("td");
      td2.className = "ligne"; td2.textContent = m.ligne; tr.appendChild(td2);

      var td3 = document.createElement("td");
      td3.className = "num"; td3.textContent = formater(m.duree_min); tr.appendChild(td3);

      var td4 = document.createElement("td");
      td4.className = "num";
      if (m._ecart === null) {
        td4.textContent = "—";
      } else if (m._ecart === 0) {
        td4.textContent = "a l'objectif";
      } else if (m._ecart > 0) {
        td4.className += " plus-lent";
        td4.textContent = "+" + formater(m._ecart);
      } else {
        td4.className += " plus-vite";
        td4.textContent = "-" + formater(-m._ecart);
      }
      tr.appendChild(td4);

      var td5 = document.createElement("td");
      td5.className = "cmt";
      var details = m.details || [];
      if (!details.length) {
        td5.textContent = "—";
      } else {
        details.forEach(function (d) {
          var bloc = document.createElement("div");
          bloc.className = "cmt-bloc";
          var nom = document.createElement("span");
          nom.className = "cmt-tache"; nom.textContent = d.tache;
          var txt = document.createElement("span");
          txt.className = "cmt-texte"; txt.textContent = d.texte;
          bloc.appendChild(nom); bloc.appendChild(txt);
          td5.appendChild(bloc);
        });
      }
      tr.appendChild(td5);

      corps.appendChild(tr);
    });

    table.appendChild(corps);
    cadre.appendChild(table);
    bloc.appendChild(cadre);
    return bloc;
  }


  // ── Pareto des causes ─────────────────────────────────────────────────────

  var SEUIL = 2;   // une cause citee une seule fois n'est pas listee

  function comptageCauses() {
    var periodeCauses = (donnees.causes || []).filter(function (c) {
      return cleDe(c.date) === periode;
    });

    // Motifs coches, causes ecrites a la main et RAS comptent tous.
    // Seuls les releves d'horaires et de numeros de lot sortent du calcul :
    // ils repondent a "quand", pas a "pourquoi".
    var retenues = periodeCauses.filter(function (c) { return c.type !== "releve"; });
    var nbReleves = periodeCauses.length - retenues.length;

    var compte = {};
    retenues.forEach(function (c) {
      if (!compte[c.cause]) compte[c.cause] = { nb: 0, dates: {}, type: c.type };
      compte[c.cause].nb += 1;
      compte[c.cause].dates[c.date] = true;
    });

    var total = retenues.length;   // base du pourcentage : toutes les causes
    var toutes = Object.keys(compte).map(function (nom) {
      return {
        cause: nom,
        nb: compte[nom].nb,
        type: compte[nom].type,
        dates: Object.keys(compte[nom].dates).sort(),
        part: total ? compte[nom].nb / total * 100 : 0
      };
    }).sort(function (a, b) {
      return b.nb - a.nb || a.cause.localeCompare(b.cause);
    });

    var liste = toutes.filter(function (c) { return c.nb >= SEUIL; });
    var uniques = toutes.filter(function (c) { return c.nb < SEUIL; });
    var nbUniques = uniques.reduce(function (s, c) { return s + c.nb; }, 0);
    var partListee = liste.reduce(function (s, c) { return s + c.part; }, 0);

    return {
      liste: liste, total: total,
      nbUniques: nbUniques, causesUniques: uniques.length,
      releves: nbReleves, partListee: partListee
    };
  }

  // ── Evolution mois par mois ───────────────────────────────────────────────

  function moisDisponibles() {
    var v = {};
    donnees.mesures.forEach(function (m) { v[m.date.slice(0, 7)] = true; });
    return Object.keys(v).sort();
  }

  function resumeMois(metrique, mois) {
    var somme = 0, nb = 0, parLigne = {};
    donnees.mesures.forEach(function (m) {
      if (m.metrique !== metrique || m.date.slice(0, 7) !== mois) return;
      somme += m.duree_min; nb += 1;
      if (!parLigne[m.ligne]) parLigne[m.ligne] = { somme: 0, nb: 0 };
      parLigne[m.ligne].somme += m.duree_min;
      parLigne[m.ligne].nb += 1;
    });
    if (!nb) return null;

    var targets = donnees.targets[metrique] || {};
    var lignes = Object.keys(parLigne).map(function (l) {
      return {
        ligne: l,
        valeur: parLigne[l].somme / parLigne[l].nb,
        nb: parLigne[l].nb,
        objectif: targets[l] != null ? targets[l] : null
      };
    }).sort(function (a, b) { return a.valeur - b.valeur; });

    var tenus = lignes.filter(function (l) {
      return l.objectif != null && l.valeur <= l.objectif;
    }).length;
    var evalues = lignes.filter(function (l) { return l.objectif != null; }).length;

    return {
      moyenne: somme / nb, nb: nb, lignes: lignes,
      tenus: tenus, evalues: evalues
    };
  }

  function dessinerEvolution() {
    var hote = document.getElementById("grille");   // occupe la case libre
    var mois = moisDisponibles();
    if (mois.length < 2) return;                    // rien a comparer

    var panneau = document.createElement("section");
    panneau.className = "panneau evolution";

    var titre = document.createElement("h2");
    titre.textContent = "Evolution mois par mois";
    panneau.appendChild(titre);

    var sous = document.createElement("p");
    sous.className = "sous";
    sous.textContent = "Plus la barre est courte, plus le temps est bon. " +
                       "Tous les mois disponibles, independamment du filtre.";
    panneau.appendChild(sous);

    Object.keys(donnees.metriques).forEach(function (code) {
      var resumes = mois.map(function (m) { return resumeMois(code, m); });
      var presents = resumes.filter(Boolean);
      if (!presents.length) return;

      // echelle commune aux mois de cet indicateur
      var maxi = 0;
      presents.forEach(function (r) {
        if (r.moyenne > maxi) maxi = r.moyenne;
        r.lignes.forEach(function (l) { if (l.valeur > maxi) maxi = l.valeur; });
      });
      maxi = maxi * 1.06 || 1;

      var bloc = document.createElement("div");
      bloc.className = "bloc";

      var nom = document.createElement("div");
      nom.className = "nom";
      nom.textContent = donnees.metriques[code];
      bloc.appendChild(nom);

      var precedente = null;

      mois.forEach(function (m, i) {
        var r = resumes[i];

        var rang = document.createElement("div");
        rang.className = "mois-ligne";

        var etiquette = document.createElement("span");
        etiquette.className = "mois-nom";
        var p = m.split("-");
        etiquette.textContent = MOIS[+p[1] - 1].slice(0, 4);
        rang.appendChild(etiquette);

        var piste = document.createElement("div");
        piste.className = "piste-mois";

        if (r) {
          var barre = document.createElement("div");
          barre.className = "barre-mois";
          barre.style.width = (r.moyenne / maxi * 100) + "%";
          piste.appendChild(barre);

          // une pastille par ligne de fabrication, a sa position
          var points = document.createElement("div");
          points.className = "points";
          r.lignes.forEach(function (l) {
            var pt = document.createElement("span");
            pt.className = "point";
            pt.style.left = (l.valeur / maxi * 100) + "%";
            pt.title = "Ligne " + l.ligne + " : " + formater(l.valeur) +
                       (l.objectif != null
                          ? " (objectif " + formater(l.objectif) + ")" : "");
            points.appendChild(pt);
          });
          piste.appendChild(points);
        }
        rang.appendChild(piste);

        var val = document.createElement("span");
        val.className = "valeur-mois";
        if (!r) {
          val.innerHTML = '<span class="stable">pas de saisie</span>';
        } else {
          val.appendChild(document.createTextNode(formater(r.moyenne)));
          var ecart = document.createElement("em");
          if (precedente === null) {
            ecart.className = "stable";
            ecart.textContent = "—";
          } else {
            var d = r.moyenne - precedente;
            if (Math.abs(d) < 0.5) { ecart.className = "stable"; ecart.textContent = "stable"; }
            else if (d < 0) { ecart.className = "en-baisse"; ecart.textContent = "-" + formater(-d); }
            else { ecart.className = "en-hausse"; ecart.textContent = "+" + formater(d); }
          }
          val.appendChild(ecart);
          val.title = r.nb + " saisie" + (r.nb > 1 ? "s" : "") + " sur " +
                      r.lignes.length + " ligne" + (r.lignes.length > 1 ? "s" : "") +
                      (r.evalues ? " — " + r.tenus + "/" + r.evalues +
                                   " a l'objectif" : "");
          precedente = r.moyenne;
        }
        rang.appendChild(val);

        bloc.appendChild(rang);
      });

      panneau.appendChild(bloc);
    });

    var note = document.createElement("p");
    note.className = "note-evo";
    note.textContent = "Chaque pastille est une ligne de fabrication, placee a son " +
                       "propre temps moyen : plus elles sont groupees, plus le parc " +
                       "est homogene.";
    panneau.appendChild(note);

    hote.appendChild(panneau);
  }

  function dessinerPareto() {
    var hote = document.getElementById("pareto");
    hote.innerHTML = "";

    var res = comptageCauses();
    if (!res.total) { hote.hidden = true; return; }
    hote.hidden = false;

    var panneau = document.createElement("section");
    panneau.className = "panneau causes";

    var titre = document.createElement("h2");
    titre.textContent = "Causes de pertes";
    panneau.appendChild(titre);

    var sous = document.createElement("p");
    sous.className = "sous";
    sous.textContent = res.total + " cause" + (res.total > 1 ? "s" : "") +
      " citee" + (res.total > 1 ? "s" : "") + " sur " + libelleDe(periode) +
      " — motifs coches et causes ecrites a la main comptent pareil.";
    panneau.appendChild(sous);

    if (!res.liste.length) {
      var vide = document.createElement("div");
      vide.className = "vide";
      vide.textContent = "Aucune cause ne revient au moins deux fois sur cette periode.";
      panneau.appendChild(vide);
      hote.appendChild(panneau);
      return;
    }

    var cadre = document.createElement("div");
    cadre.className = "cadre";
    var table = document.createElement("table");
    table.className = "tab-causes";
    table.innerHTML =
      "<thead><tr><th>Cause</th><th>Fois</th><th>Part</th><th>Dates</th></tr></thead>";

    var corps = document.createElement("tbody");
    var maxPart = res.liste[0].part;

    res.liste.forEach(function (c, i) {
      var tr = document.createElement("tr");

      var td1 = document.createElement("td");
      td1.className = "cause";
      var rang = document.createElement("span");
      rang.className = "rang"; rang.textContent = i + 1;
      var nom = document.createElement("span");
      nom.textContent = c.cause;
      td1.appendChild(rang); td1.appendChild(nom);
      if (c.type === "libre") {
        var marque = document.createElement("span");
        marque.className = "marque";
        marque.textContent = "saisie libre";
        marque.title = "Texte ecrit a la main, pas un motif de la liste";
        td1.appendChild(marque);
      }
      tr.appendChild(td1);

      var td2 = document.createElement("td");
      td2.className = "num fois"; td2.textContent = c.nb; tr.appendChild(td2);

      var td3 = document.createElement("td");
      td3.className = "pct";
      var val = document.createElement("span");
      val.className = "pct-val";
      val.textContent = c.part.toFixed(1).replace(".", ",") + " %";
      var piste = document.createElement("span");
      piste.className = "piste";
      var jauge = document.createElement("span");
      jauge.className = "jauge";
      jauge.style.width = Math.max(3, c.part / maxPart * 100) + "%";
      piste.appendChild(jauge);
      td3.appendChild(val); td3.appendChild(piste);
      tr.appendChild(td3);

      var td4 = document.createElement("td");
      td4.className = "dates";
      td4.textContent = c.dates.map(jourCourt).join(", ");
      tr.appendChild(td4);

      corps.appendChild(tr);
    });

    table.appendChild(corps);
    cadre.appendChild(table);
    panneau.appendChild(cadre);

    // ce qui n'apparait pas dans le tableau, dit explicitement
    var bouts = [];
    bouts.push("les causes listees couvrent " +
               res.partListee.toFixed(0) + " % du total");
    if (res.causesUniques) {
      bouts.push(res.causesUniques + " cause" + (res.causesUniques > 1 ? "s" : "") +
                 " citee" + (res.causesUniques > 1 ? "s" : "") +
                 " une seule fois, non listee" + (res.causesUniques > 1 ? "s" : ""));
    }
    if (res.releves) {
      bouts.push(res.releves + " releve" + (res.releves > 1 ? "s" : "") +
                 " d'horaire ou de numero de lot, hors calcul");
    }
    var note = document.createElement("p");
    note.className = "hors-pareto";
    note.textContent = bouts.join(" · ") + ".";
    panneau.appendChild(note);

    hote.appendChild(panneau);
  }

  // ── Rendu ─────────────────────────────────────────────────────────────────

  function dessinerTout() {
    var grille = document.getElementById("grille");
    grille.innerHTML = "";
    grille.hidden = false;
    document.getElementById("etat").hidden = true;

    Object.keys(graphes).forEach(function (k) { graphes[k].destroy(); });
    graphes = {};

    Object.keys(donnees.metriques).forEach(function (code) {
      var lignes = parLigne(code);
      var targets = donnees.targets[code] || {};

      var panneau = document.createElement("section");
      panneau.className = "panneau";

      var titre = document.createElement("h2");
      titre.textContent = donnees.metriques[code];
      panneau.appendChild(titre);

      var sous = document.createElement("p");
      sous.className = "sous";
      var multiples = lignes.some(function (l) { return l.nb > 1; });
      sous.textContent = (multiples ? "Moyenne par ligne — " : "Valeur par ligne — ")
                       + libelleDe(periode);
      panneau.appendChild(sous);

      if (!lignes.length) {
        var vide = document.createElement("div");
        vide.className = "vide";
        vide.textContent = "Aucune saisie pour cette periode. Choisissez une autre periode.";
        panneau.appendChild(vide);
        grille.appendChild(panneau);
        return;
      }

      var toile = document.createElement("div");
      toile.className = "toile";
      var canvas = document.createElement("canvas");
      toile.appendChild(canvas);
      panneau.appendChild(toile);

      var aDesTargets = lignes.some(function (l) { return targets[l.ligne] != null; });

      var legende = document.createElement("div");
      legende.className = "legende";
      legende.innerHTML = '<span><i class="b"></i>Temps reel</span>' +
        (aDesTargets ? '<span><i class="t"></i>Objectif</span>' : '');
      panneau.appendChild(legende);

      panneau.appendChild(construireTableau(code, targets));
      grille.appendChild(panneau);

      var reels = lignes.map(function (l) { return convertir(l.valeur); });
      var objectifs = lignes.map(function (l) {
        return targets[l.ligne] != null ? convertir(targets[l.ligne]) : null;
      });

      var jeux = [{
        type: "bar", label: "Temps reel", data: reels,
        backgroundColor: BLEU, borderRadius: 2, maxBarThickness: 56, order: 2
      }];
      if (aDesTargets) {
        jeux.push({
          type: "line", label: "Objectif", data: objectifs,
          borderColor: VERT, backgroundColor: VERT,
          borderWidth: 2.5, pointRadius: 3.5, spanGaps: true, order: 1
        });
      }

      graphes[code] = new Chart(canvas.getContext("2d"), {
        data: {
          labels: lignes.map(function (l) {
            return [l.ligne, l.nb + (l.nb > 1 ? " saisies" : " saisie")];
          }),
          datasets: jeux
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          layout: { padding: { top: 30 } },
          scales: {
            x: {
              title: { display: true, text: "Lignes de fabrication", color: "#5c6a7a" },
              grid: { display: false },
              ticks: { color: "#0d1520", font: { size: 13, weight: "600" } }
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: unite === "min" ? "Minutes" : "Heures", color: "#5c6a7a" },
              grid: { color: "#e8edf2" }, ticks: { color: "#5c6a7a" }
            }
          },
          plugins: {
            legend: { display: false },
            etiquettes: { lignes: lignes, targets: targets, formater: formater },
            tooltip: {
              callbacks: {
                title: function (items) { return "Ligne " + lignes[items[0].dataIndex].ligne; },
                label: function (ctx) {
                  var l = lignes[ctx.dataIndex];
                  if (ctx.dataset.type === "line") return "Objectif : " + formater(targets[l.ligne]);
                  return (l.nb > 1 ? "Moyenne : " : "Valeur : ") + formater(l.valeur);
                },
                afterBody: function (items) {
                  var l = lignes[items[0].dataIndex];
                  var t = targets[l.ligne];
                  if (t == null) return "";
                  var e = Math.round(l.valeur - t);
                  if (e === 0) return "A l'objectif";
                  return e > 0 ? "Plus lent de " + formater(e)
                               : "Plus rapide de " + formater(-e);
                }
              }
            }
          }
        }
      });
    });

    dessinerEvolution();
    dessinerPareto();
  }

  // ── Demarrage ─────────────────────────────────────────────────────────────

  function erreur(message) {
    var etat = document.getElementById("etat");
    etat.hidden = false; etat.textContent = message;
    document.getElementById("grille").hidden = true;
  }

  fetch("data/stats.json?" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (json) {
      donnees = json;
      if (!donnees.mesures || !donnees.mesures.length) {
        erreur("Aucune donnee disponible pour le moment."); return;
      }
      var maj = new Date(donnees.derniere_maj);
      document.getElementById("maj").textContent =
        "Mis a jour le " + maj.toLocaleDateString("fr-FR") + " a " +
        maj.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });

      periode = periodeParDefaut(periodesDisponibles());
      dessinerFiltres();
      dessinerTout();
    })
    .catch(function () {
      erreur("Les donnees n'ont pas pu etre chargees. Le calcul quotidien n'a peut-etre pas encore tourne.");
    });
})();
</script>
